[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ham-fleet"
version = "0.1.0"
license = {text = "GPL-3.0-or-later"}
description = "Build CHIRP images, CSVs, DM32 NeonPlug files and field cards for a handheld radio fleet from one channel list"
readme = "README.md"
keywords = ["ham radio", "amateur radio", "chirp", "baofeng", "codeplug", "dmr"]
requires-python = ">=3.10"
dependencies = [
  "PyYAML>=6",
  # CHIRP's own runtime needs (CHIRP itself is loaded from vendor/chirp)
  "pyserial",
  "six",
  "requests",
  "lark",
]

[project.optional-dependencies]
pdf = ["playwright"]
dev = ["pytest"]

[project.scripts]
ham-fleet = "ham_fleet.cli:main"

[tool.setuptools]
packages = ["ham_fleet"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
