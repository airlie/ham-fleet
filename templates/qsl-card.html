<title>QSL Cards %%CALL%%</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* QSL cards: standard 5.5 x 3.5 in, three per Letter page with cut marks. One fixed print look. */
:root{
  --paper:#ffffff; --ink:#151a1c; --muted:#59646a; --rule:#c4cbc8; --accent:#c4501b; --wash:#f6efe9; --desk:#e9ece9;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:light;
}
*{box-sizing:border-box}
body{margin:0;background:var(--desk);color:var(--ink);font:12px/1.3 var(--body);padding-inline:16px;padding-block:20px}
.page{display:flex;flex-direction:column;align-items:center;gap:18px}
.card{width:5.5in;max-width:100%;aspect-ratio:5.5/3.5;background:var(--paper);position:relative;overflow:hidden;
  border:1px solid var(--rule);display:grid;grid-template-columns:1.12fr 1fr;padding:.2in .22in .16in}
.waves{position:absolute;right:-.35in;top:-.55in;width:2.6in;height:2.6in;pointer-events:none}
.waves circle{fill:none;stroke:var(--accent);stroke-width:1.2;opacity:.18}
.left{display:flex;flex-direction:column;min-width:0;position:relative}
.call{font-family:var(--display);font-weight:800;font-size:.78in;line-height:.82;letter-spacing:.01em;margin:0}
.call em{font-style:normal;color:var(--accent)}
.name{font-family:var(--display);font-weight:600;font-size:.2in;margin-top:.06in;letter-spacing:.02em}
.facts{font-family:var(--mono);font-size:9.5px;color:var(--muted);margin-top:.08in;display:grid;gap:2px}
.left .bottom{margin-top:auto;font-size:8.5px;color:var(--muted);display:grid;gap:6px;padding-bottom:.04in}
.line{display:flex;gap:5px;align-items:flex-end}
.line i{font-style:normal;text-transform:uppercase;letter-spacing:.07em;font-size:7.5px}
.line b{flex:1;border-bottom:1px solid var(--ink);min-height:13px}
.right{display:flex;flex-direction:column;gap:.07in;min-width:0;position:relative;padding-bottom:.04in}
.to{font-family:var(--display);font-weight:600;font-size:13px;text-transform:uppercase;letter-spacing:.06em;display:flex;gap:6px;align-items:flex-end}
.to b{flex:1;border-bottom:1.5px solid var(--ink);min-height:18px}
.say{font-size:9px;color:var(--muted)}
table{border-collapse:collapse;width:100%;font-size:8px}
th{font-family:var(--display);font-weight:600;letter-spacing:.06em;text-transform:uppercase;font-size:8.5px;text-align:left;
   border-bottom:1.2px solid var(--ink);padding:1px 2px;color:var(--muted)}
td{border-bottom:1px solid var(--rule);height:21px}
.checks{display:flex;gap:10px;font-size:9px;flex-wrap:wrap}
.checks span::before{content:"";display:inline-block;width:8px;height:8px;border:1px solid var(--ink);margin-right:3px;vertical-align:-1px}
.sig{margin-top:auto;font-family:var(--display);font-weight:600;font-size:14px;text-align:right;letter-spacing:.04em}
.sig em{font-style:normal;color:var(--accent)}
.stripe{position:absolute;left:0;right:0;bottom:0;height:.06in;background:var(--accent)}
@media print{
  @page{size:letter;margin:.2in .25in}
  body{background:#fff;padding:0}
  .page{gap:0}
  .card{border:1px dashed #bbb;margin:0 auto;break-inside:avoid}
  .card + .card{border-top:none}
}
</style>
<div class="page">%%CARDS%%</div>
